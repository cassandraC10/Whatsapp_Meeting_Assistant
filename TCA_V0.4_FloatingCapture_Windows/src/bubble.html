<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capture</title>
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: grid; place-items: center;
      user-select: none;
      -webkit-app-region: drag;
    }
    .capture {
      width: 58px; height: 58px; padding: 0;
      border: 0; border-radius: 999px;
      display: grid; place-items: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      background: #111;
      box-shadow: 0 12px 28px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.12);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    .capture:hover {
      transform: scale(1.06);
      box-shadow: 0 15px 32px rgba(0,0,0,.34), 0 0 0 1px rgba(255,255,255,.18);
    }
    .capture:active { transform: scale(.96); }
    .capture-mark {
      width: 22px; height: 22px; border-radius: 50%;
      position: relative; box-sizing: border-box;
      border: 2px solid rgba(255,255,255,.92);
    }
    .capture-mark::after {
      content: "";
      position: absolute;
      width: 7px; height: 7px; border-radius: 50%;
      left: 50%; top: 50%; transform: translate(-50%,-50%);
      background: rgba(255,255,255,.96);
    }
    .hint {
      position: absolute; left: 50%; top: calc(100% + 8px);
      transform: translateX(-50%);
      opacity: 0; pointer-events: none;
      white-space: nowrap;
      font-size: 11px; line-height: 1;
      padding: 6px 8px; border-radius: 6px;
      color: #fff; background: rgba(17,17,17,.92);
      transition: opacity 120ms ease;
    }
    body:hover .hint { opacity: 1; }
  </style>
</head>
<body>
  <button id="capture" class="capture" aria-label="Capture conversation" title="Capture conversation">
    <span class="capture-mark" aria-hidden="true"></span>
  </button>
  <span class="hint">Capture</span>
  <script src="./bubble.js"></script>
</body>
</html>
